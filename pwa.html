<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Healthy Action</title>
<meta name="theme-color" content="#f5f7f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Healthy Action">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f5f7f5}.loading{position:fixed;inset:0;display:grid;place-items:center;color:#59645c;font-size:13px;background:#f5f7f5;z-index:2}</style>
</head>
<body>
<div id="loading" class="loading">Healthy Action · v0.8</div>
<iframe id="app" src="./v07.html" title="Healthy Action"></iframe>
<script src="./food-catalog.js"></script>
<script>
const frame=document.getElementById('app');
const foodCatalog=window.HEALTHY_FOOD_CATALOG||[];

function norm(s){return String(s||'').toLowerCase().replaceAll('ё','е').replace(/[^a-zа-я0-9%]+/gi,' ').trim()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function portionNutrition(f){return{cal:Math.round(f.kcal100*f.portion/100),protein:Math.round(f.protein100*f.portion/100)}}
function usage(){try{return JSON.parse(localStorage.getItem('ha_food_usage')||'{}')}catch(e){return{}}}
function recordUsage(id){const u=usage();u[id]={count:(u[id]?.count||0)+1,last:Date.now()};localStorage.setItem('ha_food_usage',JSON.stringify(u))}
function foodById(id){return foodCatalog.find(f=>f.id===id)}
function currentFragment(text){const s=String(text||'');const i=Math.max(s.lastIndexOf(','),s.lastIndexOf(';'),s.lastIndexOf('+'),s.lastIndexOf('\n'));return s.slice(i+1).trim()}
function searchFoods(query){
  const q=norm(query); if(q.length<2)return[];
  const words=q.split(/\s+/).filter(Boolean),u=usage();
  return foodCatalog.map(f=>{
    const names=[f.name,...f.aliases].map(norm);let best=-1;
    for(const n of names){
      const tokens=n.split(' ');
      const all=words.every(w=>tokens.some(t=>t.startsWith(w))||n.includes(w));
      if(!all)continue;
      let s=20;
      if(n===q)s+=100;
      if(n.startsWith(q))s+=70;
      if(tokens.some(t=>t.startsWith(q)))s+=45;
      s+=(u[f.id]?.count||0)*12;
      if(u[f.id]?.last)s+=Math.max(0,12-(Date.now()-u[f.id].last)/86400000);
      best=Math.max(best,s);
    }
    return{f,score:best};
  }).filter(x=>x.score>=0).sort((a,b)=>b.score-a.score||a.f.name.localeCompare(b.f.name,'ru')).slice(0,6).map(x=>x.f);
}
function popularFoods(){
  const u=usage();const used=Object.entries(u).sort((a,b)=>(b[1].count||0)-(a[1].count||0)||(b[1].last||0)-(a[1].last||0)).map(([id])=>foodById(id)).filter(Boolean);
  const defaults=['chicken_breast','egg','rice_white','cottage5','cappuccino','banana'].map(foodById).filter(Boolean);
  return [...used,...defaults].filter((f,i,a)=>a.findIndex(x=>x.id===f.id)===i).slice(0,5);
}
function matchFoodsInText(text){
  const q=norm(text);if(!q)return[];
  const candidates=[];
  foodCatalog.forEach(f=>{
    const names=[f.name,...f.aliases].map(norm).filter(x=>x.length>=3).sort((a,b)=>b.length-a.length);
    const hit=names.find(a=>q.includes(a));
    if(hit)candidates.push({f,len:hit.length});
  });
  return candidates.sort((a,b)=>b.len-a.len).filter((x,i,a)=>a.findIndex(y=>y.f.id===x.f.id)===i).slice(0,6).map(x=>x.f);
}

function ensureUiStyle(doc){
  if(doc.getElementById('pwa-shared-ui-polish'))return;
  const style=doc.createElement('style');style.id='pwa-shared-ui-polish';style.textContent=`
    .choice>b,.choice>span{display:block}.choice>span{margin-top:4px;color:var(--muted);font-size:13px;line-height:1.35}
    .sheet .choice{width:100%;min-height:74px;border-radius:20px;padding:14px 16px;text-align:left}
    .sheet .quickChoice{display:flex;align-items:center;gap:14px}.sheet .quickIcon{flex:0 0 40px;width:40px;height:40px;display:grid;place-items:center;font-size:26px;line-height:1}
    .sheet .quickCopy{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}.sheet .quickCopy b{display:block;font-size:17px;line-height:1.22;color:var(--text);font-weight:800}.sheet .quickCopy span{display:block;font-size:13px;line-height:1.35;color:var(--muted);margin:0;overflow-wrap:anywhere}
    .foodSuggestBox{margin-top:9px;display:grid;gap:7px}.foodSuggestLabel{font-size:11px;color:var(--muted);font-weight:800;margin:3px 2px 0}
    .foodSuggest{width:100%;border:1px solid var(--line);background:#fff;border-radius:16px;padding:11px 12px;display:flex;align-items:center;gap:11px;text-align:left}
    .foodSuggest:active{background:#f2f8f4}.foodSuggestIcon{width:35px;height:35px;border-radius:11px;background:var(--gs);display:grid;place-items:center;font-size:20px;flex:none}
    .foodSuggestCopy{flex:1;min-width:0}.foodSuggestCopy b{display:block;font-size:14px;line-height:1.25}.foodSuggestCopy small{display:block;color:var(--muted);font-size:11px;line-height:1.35;margin-top:3px}
    .foodCatalogHint{font-size:11px;line-height:1.45;color:var(--muted);padding:10px 2px 0}.foodMatchChips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}.foodMatchChip{font-size:11px;background:var(--gs);color:var(--gd);border-radius:999px;padding:6px 9px}
  `;doc.head.appendChild(style);
}

function applyOnboardingPolish(){
  const doc=frame.contentDocument;if(!doc)return;ensureUiStyle(doc);const ob=doc.getElementById('onboarding');if(!ob)return;
  if(!doc.getElementById('pwa-onboarding-polish')){const style=doc.createElement('style');style.id='pwa-onboarding-polish';style.textContent=`
    #onboarding{padding-top:max(28px,env(safe-area-inset-top));padding-left:18px;padding-right:18px;padding-bottom:36px}#onboarding .k{font-size:10px;letter-spacing:.12em;color:#7b857d}#onboarding h1{font-size:34px;line-height:1.02;margin:7px 0 10px;max-width:350px}#onboarding> .sub{font-size:14px;line-height:1.5;max-width:360px;color:#778078}#onboarding .steps{margin:22px 0 26px;gap:8px}#onboarding .step{height:6px;background:#dfe6df}#onboarding .step.on{background:linear-gradient(90deg,#28a65a,#39b96b)}#onboarding .field{margin-top:15px}#onboarding .field label{font-size:13px;color:#667168;margin-bottom:8px}#onboarding .field input,#onboarding .field select{height:58px;border-radius:19px;padding:0 17px;font-size:18px;background:#fff;border:1px solid #dfe6df;box-shadow:0 1px 0 rgba(20,40,25,.02)}#onboarding .field input:focus,#onboarding .field select:focus{border-color:#7bc894;box-shadow:0 0 0 4px rgba(39,158,83,.08)}#onboarding .focusGroup{margin-top:18px}#onboarding .focusGroup>label{font-size:13px;font-weight:800;color:#667168;margin-bottom:8px}#onboarding .choice.focusChoice{display:flex;align-items:center;gap:14px;min-height:78px;border-radius:20px;margin:7px 0;padding:16px;border:1px solid #dfe6df;background:#fff;text-align:left;box-shadow:0 1px 0 rgba(20,40,25,.02)}#onboarding .choice.focusChoice.sel{background:#f1faf4;border-color:#7fce9a;box-shadow:0 0 0 1px rgba(39,158,83,.05)}#onboarding .focusIcon{flex:0 0 38px;width:38px;font-size:28px;line-height:1.1;text-align:center}#onboarding .focusCopy{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}#onboarding .focusCopy b{display:block;font-size:16px;line-height:1.24;color:#17211a}#onboarding .focusCopy span{display:block;font-size:13px;line-height:1.35;color:#788179;margin:0}#onboarding .onbBadge{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border-radius:999px;background:#edf8f0;color:#237744;font-size:12px;font-weight:800;margin-top:10px}#onboarding .onbBadgeDot{width:7px;height:7px;border-radius:50%;background:#2eac61}#onboarding .onbNote{margin-top:12px;padding:12px 13px;border-radius:16px;background:#eef3ef;color:#6d786f;font-size:12px;line-height:1.45}#onboarding .btn.full{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom));margin-top:22px;min-height:58px;border-radius:20px;font-size:17px;box-shadow:0 12px 26px rgba(35,154,85,.20);z-index:4}`;doc.head.appendChild(style)}
  const mainSub=ob.querySelector(':scope > .sub');if(mainSub)mainSub.textContent='Эти значения сохранятся и будут влиять на дневные цели.';
  if(!ob.querySelector('.onbBadge')){const sub=ob.querySelector(':scope > .sub');if(sub){const badge=doc.createElement('div');badge.className='onbBadge';badge.innerHTML='<span class="onbBadgeDot"></span>Займёт меньше минуты';sub.insertAdjacentElement('afterend',badge)}}
  const focusField=[...ob.querySelectorAll('.field')].find(el=>el.querySelector('label')?.textContent.includes('Два фокуса'));if(focusField){focusField.classList.add('focusGroup');const label=focusField.querySelector('label');const choices=[...focusField.querySelectorAll('.choice[data-h]')];const cfg={vape:['🚭','Без вейпа / сигарет','Ежедневная отметка без давления и штрафов'],fastfood:['🍔','Меньше фастфуда','Следить за частотой, а не запрещать полностью'],water:['💧','Пить больше воды','Мягкая дневная цель без лишних напоминаний']};const updateCount=()=>{if(label){const n=choices.filter(x=>x.classList.contains('sel')).length;label.textContent=`Выбрано ${n} из 2`}};choices.forEach(choice=>{const c=cfg[choice.dataset.h];if(c&&!choice.classList.contains('focusChoice')){choice.classList.add('focusChoice');choice.innerHTML=`<span class="focusIcon">${c[0]}</span><span class="focusCopy"><b>${c[1]}</b><span>${c[2]}</span></span>`;choice.addEventListener('click',()=>setTimeout(updateCount,0))}});updateCount();const cta=ob.querySelector('.btn.full');if(cta&&!ob.querySelector('.onbNote')){const note=doc.createElement('div');note.className='onbNote';note.textContent='Фокусы можно будет изменить в профиле в любой момент.';cta.insertAdjacentElement('beforebegin',note)}}
}

function applyQuickMenuPolish(){const doc=frame.contentDocument,win=frame.contentWindow;if(!doc||!win)return;ensureUiStyle(doc);if(typeof win.openSheet!=='function')return;win.openQuick=function(){win.openSheet(`<h2>Что добавить?</h2><div class="list"><button class="choice quickChoice" onclick="openFood()"><span class="quickIcon">🍽</span><span class="quickCopy"><b>Еда</b><span>Текст + автодополнение</span></span></button><button class="choice quickChoice" onclick="openWeight()"><span class="quickIcon">⚖️</span><span class="quickCopy"><b>Вес</b><span>Любое значение</span></span></button><button class="choice quickChoice" onclick="addWater(250);closeSheet()"><span class="quickIcon">💧</span><span class="quickCopy"><b>Вода</b><span>Добавить 250 мл</span></span></button><button class="choice quickChoice" onclick="addSteps(1000);closeSheet()"><span class="quickIcon">👟</span><span class="quickCopy"><b>Шаги</b><span>Добавить 1000 шагов</span></span></button></div>`)}}

function applyFoodAutocomplete(){
  const doc=frame.contentDocument,win=frame.contentWindow;if(!doc||!win||win.__foodAutocompletePatched)return;if(typeof win.openSheet!=='function')return;ensureUiStyle(doc);win.__foodAutocompletePatched=true;
  const fallbackEstimate=typeof win.estimateFood==='function'?win.estimateFood.bind(win):()=>({cal:450,protein:20});
  const originalSaveFood=typeof win.saveFood==='function'?win.saveFood.bind(win):null;
  win.__selectedFoodIds=[];
  win.renderFoodSuggestions=function(){const input=doc.getElementById('foodText'),box=doc.getElementById('foodSuggestions');if(!input||!box)return;const fragment=currentFragment(input.value);const items=fragment.length>=2?searchFoods(fragment):popularFoods();const label=fragment.length>=2?'Подходит':'Недавнее и популярное';if(!items.length){box.innerHTML=fragment.length>=2?'<div class="foodCatalogHint">В каталоге пока нет совпадения — можно продолжить обычным текстом.</div>':'';return}box.innerHTML=`<div class="foodSuggestLabel">${label}</div><div class="foodSuggestBox">${items.map(f=>{const n=portionNutrition(f);return `<button class="foodSuggest" type="button" onclick="pickFood('${f.id}')"><span class="foodSuggestIcon">${f.icon}</span><span class="foodSuggestCopy"><b>${esc(f.name)}</b><small>${f.portion} г · ≈${n.cal} ккал · ${n.protein} г белка</small></span></button>`}).join('')}</div>`};
  win.foodAutocompleteInput=function(){win.renderFoodSuggestions()};
  win.pickFood=function(id){const f=foodById(id),input=doc.getElementById('foodText');if(!f||!input)return;const raw=input.value;const idx=Math.max(raw.lastIndexOf(','),raw.lastIndexOf(';'),raw.lastIndexOf('+'),raw.lastIndexOf('\n'));const prefix=idx>=0?raw.slice(0,idx+1).trimEnd()+' ':'';input.value=prefix+f.name;if(!win.__selectedFoodIds.includes(id))win.__selectedFoodIds.push(id);recordUsage(id);input.focus();input.setSelectionRange(input.value.length,input.value.length);win.renderFoodSuggestions()};
  win.openFood=function(){win.__selectedFoodIds=[];win.openSheet(`<h2>Записать еду</h2><div class="sub">Начни печатать — предложим продукты из каталога. Можно и просто написать фразу целиком.</div><div class="field"><label>Что ел?</label><textarea id="foodText" autocomplete="off" autocapitalize="sentences" placeholder="Например: куриная грудка, рис и овощи" oninput="foodAutocompleteInput()"></textarea></div><div id="foodSuggestions"></div><div class="foodCatalogHint">Сейчас это локальный MVP-каталог. КБЖУ — ориентировочные и их можно исправить перед сохранением.</div><button class="btn secondary full" onclick="previewFood()">Оценить</button><div id="foodEstimate"></div>`);setTimeout(()=>{doc.getElementById('foodText')?.focus();win.renderFoodSuggestions()},0)};
  win.previewFood=function(){const input=doc.getElementById('foodText'),out=doc.getElementById('foodEstimate');const t=input?.value.trim();if(!t)return win.toast?.('Напиши, что ты ел');let matched=(win.__selectedFoodIds||[]).map(foodById).filter(Boolean).filter(f=>norm(t).includes(norm(f.name)));if(!matched.length)matched=matchFoodsInText(t);let e;if(matched.length){e=matched.reduce((a,f)=>{const n=portionNutrition(f);a.cal+=n.cal;a.protein+=n.protein;return a},{cal:0,protein:0})}else e=fallbackEstimate(t);out.innerHTML=`<div class="two"><div class="field"><label>Ккал</label><input id="foodCal" inputmode="numeric" value="${Math.round(e.cal)}"></div><div class="field"><label>Белок, г</label><input id="foodProtein" inputmode="numeric" value="${Math.round(e.protein)}"></div></div>${matched.length?`<div class="foodMatchChips">${matched.map(f=>`<span class="foodMatchChip">${f.icon} ${esc(f.name)}</span>`).join('')}</div>`:''}<div class="tiny">Оценка прототипа. Проверь порцию и при необходимости исправь цифры.</div><button class="btn primary full" onclick="saveFood()">Записать</button>`};
  if(originalSaveFood)win.saveFood=function(){const t=doc.getElementById('foodText')?.value||'';matchFoodsInText(t).forEach(f=>recordUsage(f.id));return originalSaveFood()};
}

frame.addEventListener('load',()=>{document.getElementById('loading').style.display='none';try{applyOnboardingPolish()}catch(e){}try{applyQuickMenuPolish()}catch(e){}try{applyFoodAutocomplete()}catch(e){console.error(e)}});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
</script>
</body>
</html>
