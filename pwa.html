<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Healthy Action</title>
<meta name="theme-color" content="#f5f7f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Healthy Action">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f5f7f5}.hint{display:none;position:fixed;z-index:20;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:406px;margin:auto;background:#17211a;color:white;border-radius:18px;padding:13px 14px;box-shadow:0 16px 40px rgba(0,0,0,.24);font-size:13px;line-height:1.4}.hintRow{display:flex;gap:10px;align-items:flex-start}.hintIcon{font-size:22px}.hintText{flex:1}.hintText b{display:block;margin-bottom:2px}.hintText span{opacity:.78}.close{border:0;background:transparent;color:white;font-size:20px;padding:0 2px}.loading{position:fixed;inset:0;display:grid;place-items:center;color:#59645c;font-size:13px;background:#f5f7f5;z-index:2}
</style>
</head>
<body>
<div id="loading" class="loading">Healthy Action</div>
<iframe id="app" src="./index.html" title="Healthy Action"></iframe>
<div id="hint" class="hint"><div class="hintRow"><div class="hintIcon">↗️</div><div class="hintText"><b>Установить как приложение</b><span>В Safari нажми «Поделиться» → «На экран Домой».</span></div><button class="close" onclick="dismissHint()">×</button></div></div>
<script>
const frame=document.getElementById('app');
const KEY='healthy-action-pwa-state';
const STARTED='healthy-action-pwa-started';
const SCREEN='healthy-action-pwa-screen';
function standalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}
function isiOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)}
function dismissHint(){document.getElementById('hint').style.display='none';localStorage.setItem('healthy-action-install-hint','1')}
function showHint(){if(isiOS()&&!standalone()&&localStorage.getItem('healthy-action-install-hint')!=='1')setTimeout(()=>document.getElementById('hint').style.display='block',900)}
function run(code){try{return frame.contentWindow.eval(code)}catch(e){return null}}
frame.addEventListener('load',()=>{
 document.getElementById('loading').style.display='none';
 try{
  const saved=localStorage.getItem(KEY);
  const started=localStorage.getItem(STARTED)==='1';
  const screen=localStorage.getItem(SCREEN)||'today';
  if(saved) run(`Object.assign(S,${saved});`);
  if(started) run(`nav.style.display='grid';fab.style.display='block';go(${JSON.stringify(screen)});render();`);
 }catch(e){}
 setInterval(()=>{
  try{
   const state=run('JSON.stringify(S)');if(state)localStorage.setItem(KEY,state);
   const active=run("document.querySelector('.s.on')?.id||'o1'");if(active)localStorage.setItem(SCREEN,active);
   const began=run("document.getElementById('nav').style.display==='grid'||!['o1','o2','o3','o4'].includes(document.querySelector('.s.on')?.id)");
   if(began)localStorage.setItem(STARTED,'1');
  }catch(e){}
 },700);
});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
showHint();
</script>
</body>
</html>
