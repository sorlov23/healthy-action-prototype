services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: healthy_action
      POSTGRES_USER: healthy_action
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthy_action}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthy_action -d healthy_action"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 700M

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://healthy_action:${POSTGRES_PASSWORD:-healthy_action}@postgres:5432/healthy_action
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        limits:
          memory: 350M

volumes:
  postgres_data:
