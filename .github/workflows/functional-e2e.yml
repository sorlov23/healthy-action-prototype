name: rinlo functional e2e

on:
  push:
    paths:
      - 'pwa.html'
      - 'v07.html'
      - 'rinlo-*.js'
      - 'tests/rinlo-functional.mjs'
      - '.github/workflows/functional-e2e.yml'
  pull_request:
    paths:
      - 'pwa.html'
      - 'v07.html'
      - 'rinlo-*.js'
      - 'tests/rinlo-functional.mjs'
      - '.github/workflows/functional-e2e.yml'

jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Keep functional browser test offline from live backends
        run: |
          cat > runtime-config.js <<'EOF'
          window.HEALTHY_ACTION_CONFIG = Object.freeze({
            apiBase: '',
            apiTimeoutMs: 5000,
            supabaseUrl: '',
            supabasePublishableKey: '',
            supabaseAuthEnabled: false,
            supabaseDataEnabled: false,
          });
          EOF

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          for attempt in 1 2 3; do
            if npx playwright install chromium; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Playwright Chromium installation failed after 3 attempts"
              exit 1
            fi
            echo "Playwright Chromium installation failed (attempt $attempt/3); retrying..."
            sleep $((attempt * 5))
          done

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/rinlo-http.log 2>&1 &
          echo $! > /tmp/rinlo-http.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/pwa.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/rinlo-http.log
          exit 1

      - name: Run mobile functional smoke test
        run: |
          if node tests/rinlo-functional.mjs; then
            exit 0
          fi
          echo '--- PWA HTTP server log ---'
          cat /tmp/rinlo-http.log || true
          exit 1
