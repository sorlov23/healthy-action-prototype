name: rinlo neon backend ci

on:
  pull_request:
    paths:
      - 'neon/**'
      - '.github/workflows/rinlo-neon-ci.yml'

permissions:
  contents: read

jobs:
  neon-ai-build-and-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Neon backend dependencies
        run: npm install --no-package-lock
        working-directory: neon
      - name: Typecheck Neon Gemini handler
        run: npm run typecheck
        working-directory: neon
      - name: Bundle Neon Gemini handler
        run: npm run build
        working-directory: neon
      - name: Verify cryptographic JWT gate and missing-secret behavior
        run: npm test
        working-directory: neon
