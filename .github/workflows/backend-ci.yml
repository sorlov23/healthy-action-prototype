name: backend ci

on:
  push:
    paths:
      - 'backend/**'
      - 'food-catalog.js'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'food-catalog.js'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: healthy_action
          POSTGRES_USER: healthy_action
          POSTGRES_PASSWORD: healthy_action
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthy_action -d healthy_action"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgres://healthy_action:healthy_action@127.0.0.1:5432/healthy_action
      FRONTEND_ORIGINS: https://sorlov23.github.io
      SESSION_TTL_DAYS: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run migrate
      - run: npm run seed:foods
      - name: Smoke test complete MVP persistence lifecycle
        run: |
          node --input-type=module <<'NODE'
          import { searchFoods } from './src/food-search.js';
          import { resolveFoodText } from './src/food-resolver.js';
          import { createGuestSession, authenticateToken } from './src/auth.js';
          import { upsertProfile, getProfile } from './src/profile.js';
          import { createFoodLog, getFoodLogsForDay } from './src/food-logs.js';
          import { createWeightLog, applyDailyMetricDelta, setDailyHabit, getDayOverview } from './src/state.js';
          import { buildBootstrap } from './src/bootstrap.js';
          import { deleteAccount } from './src/account.js';
          import { pool } from './src/db.js';

          const search = await searchFoods('кур', 6);
          if (!search.some((x) => x.id === 'chicken_breast')) {
            throw new Error('chicken_breast not found for кур');
          }

          const resolved = await resolveFoodText('куриная грудка с рисом');
          const ids = resolved.items.map((x) => x.food.id);
          if (!ids.includes('chicken_breast') || !ids.includes('rice_white')) {
            throw new Error(`resolver mismatch: ${ids.join(', ')}`);
          }

          const session = await createGuestSession();
          const auth = await authenticateToken(session.token);
          if (!auth || auth.userId !== session.userId) {
            throw new Error('guest session authentication failed');
          }

          const plaintext = await pool.query('select 1 from auth_sessions where token_hash = $1', [session.token]);
          if (plaintext.rowCount) throw new Error('plaintext session token stored in database');

          await upsertProfile(session.userId, {
            startWeightKg: 85,
            targetWeightKg: 75,
            heightCm: 176,
            ageYears: 37,
            activity: 'low',
            focuses: ['vape', 'fastfood'],
            calorieTarget: 1700,
            proteinTargetG: 135,
            stepTarget: 8000,
          });
          const profile = await getProfile(session.userId);
          if (!profile || profile.startWeightKg !== 85 || profile.targetWeightKg !== 75 || profile.focuses.join(',') !== 'vape,fastfood') {
            throw new Error(`profile persistence mismatch: ${JSON.stringify(profile)}`);
          }

          const log = await createFoodLog(session.userId, {
            eatenAt: '2026-09-07T12:00:00.000Z',
            source: 'text',
            originalText: 'куриная грудка с рисом',
            totalKcal: resolved.totals.kcal,
            totalProtein: resolved.totals.protein,
            items: resolved.items.map((item) => ({
              foodId: item.food.id,
              name: item.food.name,
              grams: item.grams,
              kcal: item.kcal,
              protein: item.protein,
              confidence: item.confidence,
            })),
          });
          if (!log.id || log.items.length < 2) throw new Error('food log persistence failed');

          const dayFood = await getFoodLogsForDay(session.userId, '2026-09-07', 0);
          if (dayFood.items.length !== 1 || dayFood.totals.kcal !== resolved.totals.kcal) {
            throw new Error(`day food persistence mismatch: ${JSON.stringify(dayFood)}`);
          }

          await createWeightLog(session.userId, 84.6, '2026-09-07T07:00:00.000Z');
          let metrics = await applyDailyMetricDelta(session.userId, '2026-09-07', { waterMlDelta: 250, stepsDelta: 1000 });
          metrics = await applyDailyMetricDelta(session.userId, '2026-09-07', { waterMlDelta: 250, stepsDelta: 3500 });
          metrics = await setDailyHabit(session.userId, '2026-09-07', 'vape', true);
          if (metrics.waterMl !== 500 || metrics.steps !== 4500 || metrics.habits.vape !== true) {
            throw new Error(`daily metrics mismatch: ${JSON.stringify(metrics)}`);
          }

          const overview = await getDayOverview(session.userId, '2026-09-07', 0);
          if (overview.weight?.weightKg !== 84.6 || overview.metrics.steps !== 4500 || overview.food.items.length !== 1) {
            throw new Error(`day overview mismatch: ${JSON.stringify(overview)}`);
          }

          const bootstrap = await buildBootstrap(session.userId, '2026-09-07', 0);
          if (bootstrap.profile?.targetWeightKg !== 75 || bootstrap.day.metrics.waterMl !== 500 || bootstrap.weights.length !== 1) {
            throw new Error(`bootstrap mismatch: ${JSON.stringify(bootstrap)}`);
          }

          const deleted = await deleteAccount(session.userId);
          if (!deleted) throw new Error('account deletion failed');
          const afterDelete = await authenticateToken(session.token);
          if (afterDelete) throw new Error('session survived account deletion');
          const userRows = await pool.query('select 1 from app_users where id = $1', [session.userId]);
          const logRows = await pool.query('select 1 from food_logs where user_id = $1', [session.userId]);
          const weightRows = await pool.query('select 1 from weight_logs where user_id = $1', [session.userId]);
          if (userRows.rowCount || logRows.rowCount || weightRows.rowCount) {
            throw new Error('cascade deletion incomplete');
          }

          console.log({ lifecycle: 'ok', bootstrap: { profile: bootstrap.profile, day: bootstrap.day } });
          await pool.end();
          NODE
