name: frontend ci

on:
  push:
    paths:
      - 'pwa.html'
      - 'runtime-config.js'
      - 'food-catalog.js'
      - 'pwa-enhancements.js'
      - 'pwa-api.js'
      - 'pwa-sync.js'
      - 'pwa-state-sync.js'
      - 'pwa-profile-sync.js'
      - 'pwa-account-sync.js'
      - 'ui-polish.js'
      - 'rinlo-wordmark.js'
      - 'rinlo-logo.svg'
      - 'rinlo-scale-pass-v1.js'
      - 'rinlo-functional-v1.js'
      - 'rinlo-stability-v1.js'
      - 'rinlo-server-sync-v1.js'
      - 'rinlo-server-restore-v1.js'
      - 'rinlo-supabase-auth-v1.js'
      - 'rinlo-supabase-transport-v1.js'
      - 'rinlo-settings-bridge-v1.js'
      - 'rinlo-polish-v03.js'
      - 'rinlo-onboarding-v01.js'
      - 'rinlo-plan-v01.js'
      - 'rinlo-insights-v01.js'
      - 'rinlo-profile-v01.js'
      - 'rinlo-system-v01.js'
      - 'rinlo-core-ui-v1.js'
      - 'tests/rinlo-supabase-auth.mjs'
      - 'tests/rinlo-supabase-transport.mjs'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'service-worker.js'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'pwa.html'
      - 'runtime-config.js'
      - 'food-catalog.js'
      - 'pwa-enhancements.js'
      - 'pwa-api.js'
      - 'pwa-sync.js'
      - 'pwa-state-sync.js'
      - 'pwa-profile-sync.js'
      - 'pwa-account-sync.js'
      - 'ui-polish.js'
      - 'rinlo-wordmark.js'
      - 'rinlo-logo.svg'
      - 'rinlo-scale-pass-v1.js'
      - 'rinlo-functional-v1.js'
      - 'rinlo-stability-v1.js'
      - 'rinlo-server-sync-v1.js'
      - 'rinlo-server-restore-v1.js'
      - 'rinlo-supabase-auth-v1.js'
      - 'rinlo-supabase-transport-v1.js'
      - 'rinlo-settings-bridge-v1.js'
      - 'rinlo-polish-v03.js'
      - 'rinlo-onboarding-v01.js'
      - 'rinlo-plan-v01.js'
      - 'rinlo-insights-v01.js'
      - 'rinlo-profile-v01.js'
      - 'rinlo-system-v01.js'
      - 'rinlo-core-ui-v1.js'
      - 'tests/rinlo-supabase-auth.mjs'
      - 'tests/rinlo-supabase-transport.mjs'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'service-worker.js'
      - '.github/workflows/frontend-ci.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check runtime-config.js
          node --check food-catalog.js
          node --check pwa-enhancements.js
          node --check pwa-api.js
          node --check pwa-sync.js
          node --check pwa-state-sync.js
          node --check pwa-profile-sync.js
          node --check pwa-account-sync.js
          node --check ui-polish.js
          node --check rinlo-wordmark.js
          node --check rinlo-scale-pass-v1.js
          node --check rinlo-functional-v1.js
          node --check rinlo-stability-v1.js
          node --check rinlo-server-sync-v1.js
          node --check rinlo-server-restore-v1.js
          node --check rinlo-supabase-auth-v1.js
          node --check rinlo-supabase-transport-v1.js
          node --check rinlo-settings-bridge-v1.js
          node --check rinlo-polish-v03.js
          node --check rinlo-onboarding-v01.js
          node --check rinlo-plan-v01.js
          node --check rinlo-insights-v01.js
          node --check rinlo-profile-v01.js
          node --check rinlo-system-v01.js
          node --check rinlo-core-ui-v1.js
          node --check tests/rinlo-supabase-auth.mjs
          node --check tests/rinlo-supabase-transport.mjs
          node --check service-worker.js

      - name: Test Supabase auth lifecycle
        run: node tests/rinlo-supabase-auth.mjs

      - name: Test Supabase data transport
        run: node tests/rinlo-supabase-transport.mjs

      - name: Check public Supabase config safety
        run: |
          grep -q "supabaseAuthEnabled: true" runtime-config.js
          grep -q "supabaseDataEnabled: true" runtime-config.js
          grep -q "supabaseUrl: 'https://xhlbiaueiqcmgifmihur.supabase.co'" runtime-config.js
          grep -q "supabasePublishableKey: 'sb_publishable_" runtime-config.js
          ! grep -qiE 'service_role|sb_secret_' runtime-config.js

      - name: Check PWA asset wiring
        run: |
          grep -q 'runtime-config.js?rev=39' pwa.html
          grep -q 'rinlo-supabase-auth-v1.js?rev=38' pwa.html
          grep -q 'rinlo-supabase-transport-v1.js?rev=39' pwa.html
          grep -q 'pwa-api.js?rev=24' pwa.html
          grep -q 'pwa-sync.js?rev=24' pwa.html
          grep -q 'pwa-state-sync.js?rev=24' pwa.html
          grep -q 'pwa-profile-sync.js?rev=24' pwa.html
          grep -q 'pwa-account-sync.js?rev=24' pwa.html
          grep -q 'ui-polish.js?rev=36' pwa.html
          grep -q 'rinlo-polish-v03.js?rev=36' pwa.html
          grep -q 'rinlo-plan-v01.js?rev=37' pwa.html
          grep -q 'rinlo-system-v01.js?rev=35' pwa.html
          grep -q 'rinlo-core-ui-v1.js?rev=25' pwa.html
          grep -q 'rinlo-scale-pass-v1.js?rev=29' pwa.html
          grep -q 'rinlo-functional-v1.js?rev=30' pwa.html
          grep -q 'rinlo-stability-v1.js?rev=35' pwa.html
          grep -q 'rinlo-server-sync-v1.js?rev=40' pwa.html
          grep -q 'rinlo-server-restore-v1.js?rev=33' pwa.html
          grep -q 'rinlo-wordmark.js?rev=30' pwa.html
          grep -q 'rinlo-settings-bridge-v1.js?rev=34' pwa.html
          grep -q 'rinlo-logo.svg?rev=31' pwa.html
          grep -q 'icon.svg?rev=31' pwa.html
          grep -q 'service-worker.js?rev=40' pwa.html
          grep -q "rinlo-pwa-v40" service-worker.js
          grep -q "./runtime-config.js?rev=39" service-worker.js
          grep -q "./rinlo-supabase-auth-v1.js?rev=38" service-worker.js
          grep -q "./rinlo-supabase-transport-v1.js?rev=39" service-worker.js
          grep -q "./ui-polish.js?rev=36" service-worker.js
          grep -q "./rinlo-polish-v03.js?rev=36" service-worker.js
          grep -q "./rinlo-plan-v01.js?rev=37" service-worker.js
          grep -q "./rinlo-system-v01.js?rev=35" service-worker.js
          grep -q "./rinlo-core-ui-v1.js?rev=25" service-worker.js
          grep -q "./rinlo-scale-pass-v1.js?rev=29" service-worker.js
          grep -q "./rinlo-functional-v1.js?rev=30" service-worker.js
          grep -q "./rinlo-stability-v1.js?rev=35" service-worker.js
          grep -q "./rinlo-server-sync-v1.js?rev=40" service-worker.js
          grep -q "./rinlo-server-restore-v1.js?rev=33" service-worker.js
          grep -q "./rinlo-wordmark.js?rev=30" service-worker.js
          grep -q "./rinlo-settings-bridge-v1.js?rev=34" service-worker.js
          grep -q "./rinlo-logo.svg?rev=31" service-worker.js
          grep -q "./icon.svg?rev=31" service-worker.js
          grep -q "url.pathname.includes('/api/')" service-worker.js
          grep -q 'linearGradient id="top"' rinlo-logo.svg
          grep -q 'linearGradient id="bottom"' rinlo-logo.svg
          runtime_line=$(grep -n 'runtime-config.js?rev=39' pwa.html | cut -d: -f1)
          auth_line=$(grep -n 'rinlo-supabase-auth-v1.js?rev=38' pwa.html | cut -d: -f1)
          transport_line=$(grep -n 'rinlo-supabase-transport-v1.js?rev=39' pwa.html | cut -d: -f1)
          core_line=$(grep -n 'rinlo-core-ui-v1.js?rev=25' pwa.html | cut -d: -f1)
          scale_line=$(grep -n 'rinlo-scale-pass-v1.js?rev=29' pwa.html | cut -d: -f1)
          functional_line=$(grep -n 'rinlo-functional-v1.js?rev=30' pwa.html | cut -d: -f1)
          stability_line=$(grep -n 'rinlo-stability-v1.js?rev=35' pwa.html | cut -d: -f1)
          sync_line=$(grep -n 'rinlo-server-sync-v1.js?rev=40' pwa.html | cut -d: -f1)
          restore_line=$(grep -n 'rinlo-server-restore-v1.js?rev=33' pwa.html | cut -d: -f1)
          brand_line=$(grep -n 'rinlo-wordmark.js?rev=30' pwa.html | cut -d: -f1)
          settings_line=$(grep -n 'rinlo-settings-bridge-v1.js?rev=34' pwa.html | cut -d: -f1)
          test "$runtime_line" -lt "$auth_line"
          test "$auth_line" -lt "$transport_line"
          test "$transport_line" -lt "$core_line"
          test "$core_line" -lt "$scale_line"
          test "$scale_line" -lt "$functional_line"
          test "$functional_line" -lt "$stability_line"
          test "$stability_line" -lt "$sync_line"
          test "$sync_line" -lt "$restore_line"
          test "$restore_line" -lt "$brand_line"
          test "$brand_line" -lt "$settings_line"
