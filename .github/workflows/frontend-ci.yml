  push:
    paths:
      - 'pwa.html'
      - 'runtime-config.js'
      - 'food-catalog.js'
      - 'pwa-enhancements.js'
      - 'pwa-api.js'
      - 'pwa-sync.js'
      - 'pwa-state-sync.js'
      - 'pwa-profile-sync.js'
      - 'pwa-account-sync.js'
      - 'ui-polish.js'
      - 'rinlo-wordmark.js'
      - 'rinlo-logo.svg'
      - 'rinlo-scale-pass-v1.js'
      - 'rinlo-functional-v1.js'
      - 'rinlo-stability-v1.js'
      - 'rinlo-server-sync-v1.js'
      - 'rinlo-adaptive-learning-v1.js'
      - 'rinlo-action-sync-v1.js'
      - 'rinlo-evening-review-v1.js'
      - 'rinlo-server-restore-v1.js'
      - 'rinlo-supabase-auth-v1.js'
      - 'rinlo-supabase-transport-v1.js'
      - 'rinlo-supabase-action-transport-v1.js'
      - 'rinlo-supabase-evening-review-transport-v1.js'
      - 'rinlo-settings-bridge-v1.js'
      - 'rinlo-polish-v03.js'
      - 'rinlo-onboarding-v01.js'
      - 'rinlo-plan-v01.js'
      - 'rinlo-insights-v01.js'
      - 'rinlo-profile-v01.js'
      - 'rinlo-system-v01.js'
      - 'rinlo-core-ui-v1.js'
      - 'tests/rinlo-supabase-auth.mjs'
      - 'tests/rinlo-supabase-transport.mjs'
      - 'tests/rinlo-supabase-action-transport.mjs'
      - 'tests/rinlo-supabase-evening-review-transport.mjs'
      - 'tests/rinlo-action-sync.mjs'
      - 'tests/rinlo-evening-review.mjs'
      - 'tests/rinlo-adaptive-learning.mjs'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'service-worker.js'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'pwa.html'
      - 'runtime-config.js'
      - 'food-catalog.js'
      - 'pwa-enhancements.js'
      - 'pwa-api.js'
      - 'pwa-sync.js'
      - 'pwa-state-sync.js'
      - 'pwa-profile-sync.js'
      - 'pwa-account-sync.js'
      - 'ui-polish.js'
      - 'rinlo-wordmark.js'
      - 'rinlo-logo.svg'
      - 'rinlo-scale-pass-v1.js'
      - 'rinlo-functional-v1.js'
      - 'rinlo-stability-v1.js'
      - 'rinlo-server-sync-v1.js'
      - 'rinlo-adaptive-learning-v1.js'
      - 'rinlo-action-sync-v1.js'
      - 'rinlo-evening-review-v1.js'
      - 'rinlo-server-restore-v1.js'
      - 'rinlo-supabase-auth-v1.js'
      - 'rinlo-supabase-transport-v1.js'
      - 'rinlo-supabase-action-transport-v1.js'
      - 'rinlo-supabase-evening-review-transport-v1.js'
      - 'rinlo-settings-bridge-v1.js'
      - 'rinlo-polish-v03.js'
      - 'rinlo-onboarding-v01.js'
      - 'rinlo-plan-v01.js'
      - 'rinlo-insights-v01.js'
      - 'rinlo-profile-v01.js'
      - 'rinlo-system-v01.js'
      - 'rinlo-core-ui-v1.js'
      - 'tests/rinlo-supabase-auth.mjs'
      - 'tests/rinlo-supabase-transport.mjs'
      - 'tests/rinlo-supabase-action-transport.mjs'
      - 'tests/rinlo-supabase-evening-review-transport.mjs'
      - 'tests/rinlo-action-sync.mjs'
      - 'tests/rinlo-evening-review.mjs'
      - 'tests/rinlo-adaptive-learning.mjs'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'service-worker.js'
      - '.github/workflows/frontend-ci.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check runtime-config.js
          node --check food-catalog.js
          node --check pwa-enhancements.js
          node --check pwa-api.js
          node --check pwa-sync.js
          node --check pwa-state-sync.js
          node --check pwa-profile-sync.js
          node --check pwa-account-sync.js
          node --check ui-polish.js
          node --check rinlo-wordmark.js
          node --check rinlo-scale-pass-v1.js
          node --check rinlo-functional-v1.js
          node --check rinlo-stability-v1.js
          node --check rinlo-server-sync-v1.js
          node --check rinlo-adaptive-learning-v1.js
          node --check rinlo-action-sync-v1.js
          node --check rinlo-evening-review-v1.js
          node --check rinlo-server-restore-v1.js
          node --check rinlo-supabase-auth-v1.js
          node --check rinlo-supabase-transport-v1.js
          node --check rinlo-supabase-action-transport-v1.js
          node --check rinlo-supabase-evening-review-transport-v1.js
          node --check rinlo-settings-bridge-v1.js
          node --check rinlo-polish-v03.js
          node --check rinlo-onboarding-v01.js
          node --check rinlo-plan-v01.js
          node --check rinlo-insights-v01.js
          node --check rinlo-profile-v01.js
          node --check rinlo-system-v01.js
          node --check rinlo-core-ui-v1.js
          node --check tests/rinlo-supabase-auth.mjs
          node --check tests/rinlo-supabase-transport.mjs
          node --check tests/rinlo-supabase-action-transport.mjs
          node --check tests/rinlo-supabase-evening-review-transport.mjs
          node --check tests/rinlo-action-sync.mjs
          node --check tests/rinlo-evening-review.mjs
          node --check tests/rinlo-adaptive-learning.mjs
          node --check service-worker.js

      - name: Test Supabase auth lifecycle
        run: node tests/rinlo-supabase-auth.mjs

      - name: Test Supabase data transport
        run: node tests/rinlo-supabase-transport.mjs

      - name: Test Supabase action transport
        run: node tests/rinlo-supabase-action-transport.mjs

      - name: Test Supabase evening review transport
        run: node tests/rinlo-supabase-evening-review-transport.mjs

      - name: Test durable Plan action sync
        run: node tests/rinlo-action-sync.mjs

      - name: Test durable evening review sync
        run: node tests/rinlo-evening-review.mjs

      - name: Test adaptive learning contract
        run: node tests/rinlo-adaptive-learning.mjs

      - name: Check public Supabase config safety
        run: |
          grep -q "supabaseAuthEnabled: true" runtime-config.js
          grep -q "supabaseDataEnabled: true" runtime-config.js
          grep -q "supabaseUrl: 'https://xhlbiaueiqcmgifmihur.supabase.co'" runtime-config.js
          grep -q "supabasePublishableKey: 'sb_publishable_" runtime-config.js
          ! grep -qiE 'service_role|sb_secret_' runtime-config.js

      - name: Check PWA asset wiring
        run: |
          grep -q 'runtime-config.js?rev=39' pwa.html
          grep -q 'rinlo-supabase-auth-v1.js?rev=38' pwa.html
          grep -q 'rinlo-supabase-transport-v1.js?rev=39' pwa.html
          grep -q 'rinlo-supabase-action-transport-v1.js?rev=43' pwa.html
          grep -q 'rinlo-supabase-evening-review-transport-v1.js?rev=46' pwa.html
          grep -q 'pwa-api.js?rev=24' pwa.html
          grep -q 'pwa-sync.js?rev=24' pwa.html
          grep -q 'pwa-state-sync.js?rev=24' pwa.html
          grep -q 'pwa-profile-sync.js?rev=24' pwa.html
          grep -q 'pwa-account-sync.js?rev=24' pwa.html
          grep -q 'ui-polish.js?rev=36' pwa.html
          grep -q 'rinlo-polish-v03.js?rev=36' pwa.html
          grep -q 'rinlo-plan-v01.js?rev=37' pwa.html
          grep -q 'rinlo-profile-v01.js?rev=45' pwa.html
          grep -q 'rinlo-system-v01.js?rev=35' pwa.html
          grep -q 'rinlo-core-ui-v1.js?rev=25' pwa.html
          grep -q 'rinlo-scale-pass-v1.js?rev=29' pwa.html
          grep -q 'rinlo-functional-v1.js?rev=30' pwa.html
          grep -q 'rinlo-stability-v1.js?rev=48' pwa.html
          grep -q 'rinlo-server-sync-v1.js?rev=42' pwa.html
          grep -q 'rinlo-adaptive-learning-v1.js?rev=49' pwa.html
          grep -q 'rinlo-action-sync-v1.js?rev=42' pwa.html
          grep -q 'rinlo-evening-review-v1.js?rev=46' pwa.html
          grep -q 'rinlo-server-restore-v1.js?rev=33' pwa.html
          grep -q 'service-worker.js?rev=49' pwa.html
          grep -Fq "rinloFrame?.addEventListener('load',revealRinlo)" pwa.html
          grep -Fq "rinloFrame?.contentDocument?.readyState==='complete'" pwa.html
          grep -q "rinlo-pwa-v49" service-worker.js
          grep -q "./rinlo-supabase-action-transport-v1.js?rev=43" service-worker.js
          grep -q "./rinlo-supabase-evening-review-transport-v1.js?rev=46" service-worker.js
          grep -q "./rinlo-profile-v01.js?rev=45" service-worker.js
          grep -q "./rinlo-stability-v1.js?rev=48" service-worker.js
          grep -q "./rinlo-server-sync-v1.js?rev=42" service-worker.js
          grep -q "./rinlo-adaptive-learning-v1.js?rev=49" service-worker.js
          grep -q "./rinlo-action-sync-v1.js?rev=42" service-worker.js
          grep -q "./rinlo-evening-review-v1.js?rev=46" service-worker.js
          grep -q "url.pathname.includes('/api/')" service-worker.js
          transport_line=$(grep -n 'rinlo-supabase-transport-v1.js?rev=39' pwa.html | cut -d: -f1)
          action_transport_line=$(grep -n 'rinlo-supabase-action-transport-v1.js?rev=43' pwa.html | cut -d: -f1)
          review_transport_line=$(grep -n 'rinlo-supabase-evening-review-transport-v1.js?rev=46' pwa.html | cut -d: -f1)
          core_line=$(grep -n 'rinlo-core-ui-v1.js?rev=25' pwa.html | cut -d: -f1)
          sync_line=$(grep -n 'rinlo-server-sync-v1.js?rev=42' pwa.html | cut -d: -f1)
          adaptive_line=$(grep -n 'rinlo-adaptive-learning-v1.js?rev=49' pwa.html | cut -d: -f1)
          action_sync_line=$(grep -n 'rinlo-action-sync-v1.js?rev=42' pwa.html | cut -d: -f1)
          evening_review_line=$(grep -n 'rinlo-evening-review-v1.js?rev=46' pwa.html | cut -d: -f1)
          restore_line=$(grep -n 'rinlo-server-restore-v1.js?rev=33' pwa.html | cut -d: -f1)
          test "$transport_line" -lt "$action_transport_line"
          test "$action_transport_line" -lt "$review_transport_line"
          test "$review_transport_line" -lt "$core_line"
          test "$core_line" -lt "$sync_line"
          test "$sync_line" -lt "$adaptive_line"
          test "$adaptive_line" -lt "$action_sync_line"
          test "$action_sync_line" -lt "$evening_review_line"
          test "$evening_review_line" -lt "$restore_line"
