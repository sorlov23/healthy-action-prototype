name: frontend ci

on:
  push:
    paths:
      - 'pwa.html'
      - 'runtime-config.js'
      - 'food-catalog.js'
      - 'pwa-enhancements.js'
      - 'pwa-api.js'
      - 'pwa-sync.js'
      - 'pwa-state-sync.js'
      - 'pwa-profile-sync.js'
      - 'pwa-account-sync.js'
      - 'ui-polish.js'
      - 'rinlo-wordmark.js'
      - 'rinlo-logo.svg'
      - 'rinlo-polish-v03.js'
      - 'rinlo-onboarding-v01.js'
      - 'rinlo-plan-v01.js'
      - 'rinlo-insights-v01.js'
      - 'rinlo-profile-v01.js'
      - 'rinlo-system-v01.js'
      - 'rinlo-core-ui-v1.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'service-worker.js'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'pwa.html'
      - 'runtime-config.js'
      - 'food-catalog.js'
      - 'pwa-enhancements.js'
      - 'pwa-api.js'
      - 'pwa-sync.js'
      - 'pwa-state-sync.js'
      - 'pwa-profile-sync.js'
      - 'pwa-account-sync.js'
      - 'ui-polish.js'
      - 'rinlo-wordmark.js'
      - 'rinlo-logo.svg'
      - 'rinlo-polish-v03.js'
      - 'rinlo-onboarding-v01.js'
      - 'rinlo-plan-v01.js'
      - 'rinlo-insights-v01.js'
      - 'rinlo-profile-v01.js'
      - 'rinlo-system-v01.js'
      - 'rinlo-core-ui-v1.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'service-worker.js'
      - '.github/workflows/frontend-ci.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check runtime-config.js
          node --check food-catalog.js
          node --check pwa-enhancements.js
          node --check pwa-api.js
          node --check pwa-sync.js
          node --check pwa-state-sync.js
          node --check pwa-profile-sync.js
          node --check pwa-account-sync.js
          node --check ui-polish.js
          node --check rinlo-wordmark.js
          node --check rinlo-polish-v03.js
          node --check rinlo-onboarding-v01.js
          node --check rinlo-plan-v01.js
          node --check rinlo-insights-v01.js
          node --check rinlo-profile-v01.js
          node --check rinlo-system-v01.js
          node --check rinlo-core-ui-v1.js
          node --check service-worker.js
      - name: Check PWA asset wiring
        run: |
          grep -q 'runtime-config.js?rev=24' pwa.html
          grep -q 'pwa-api.js?rev=24' pwa.html
          grep -q 'pwa-sync.js?rev=24' pwa.html
          grep -q 'pwa-state-sync.js?rev=24' pwa.html
          grep -q 'pwa-profile-sync.js?rev=24' pwa.html
          grep -q 'pwa-account-sync.js?rev=24' pwa.html
          grep -q 'rinlo-system-v01.js?rev=24' pwa.html
          grep -q 'rinlo-core-ui-v1.js?rev=25' pwa.html
          grep -q 'rinlo-wordmark.js?rev=28' pwa.html
          grep -q 'rinlo-logo.svg?rev=28' pwa.html
          grep -q 'icon.svg?rev=28' pwa.html
          grep -q 'service-worker.js?rev=28' pwa.html
          grep -q "rinlo-pwa-v28" service-worker.js
          grep -q "./rinlo-core-ui-v1.js?rev=25" service-worker.js
          grep -q "./rinlo-wordmark.js?rev=28" service-worker.js
          grep -q "./rinlo-logo.svg?rev=28" service-worker.js
          grep -q "./icon.svg?rev=28" service-worker.js
          grep -q "url.pathname.includes('/api/')" service-worker.js
          grep -q 'linearGradient id="top"' rinlo-logo.svg
          grep -q 'linearGradient id="bottom"' rinlo-logo.svg
          core_line=$(grep -n 'rinlo-core-ui-v1.js?rev=25' pwa.html | cut -d: -f1)
          brand_line=$(grep -n 'rinlo-wordmark.js?rev=28' pwa.html | cut -d: -f1)
          test "$core_line" -lt "$brand_line"
