name: rinlo live supabase probe

on:
  push:
    branches:
      - 'probe/rinlo-live-f51d489d'
    paths:
      - 'tests/_live-supabase-restore.mjs'
      - '.github/workflows/_rinlo-live-supabase-probe.yml'

jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          for attempt in 1 2 3; do
            if npx playwright install chromium; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Start PWA server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/rinlo-live-http.log 2>&1 &
          echo $! > /tmp/rinlo-live-http.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/pwa.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/rinlo-live-http.log
          exit 1

      - name: Run live Supabase restore probe
        run: |
          if node tests/_live-supabase-restore.mjs; then
            exit 0
          fi
          echo '--- PWA HTTP server log ---'
          cat /tmp/rinlo-live-http.log || true
          exit 1
