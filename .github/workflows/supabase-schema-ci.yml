name: rinlo supabase schema ci

on:
  push:
    paths:
      - 'supabase/schema/**'
      - '.github/workflows/supabase-schema-ci.yml'
  pull_request:
    paths:
      - 'supabase/schema/**'
      - '.github/workflows/supabase-schema-ci.yml'

jobs:
  foundation-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rinlo_schema_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rinlo_schema_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      PGPASSWORD: postgres
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: rinlo_schema_ci

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Supabase auth/role stubs
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create schema auth;
          create schema extensions;
          create table auth.users (id uuid primary key);
          create function auth.uid() returns uuid
          language sql stable
          as $$ select null::uuid $$;
          SQL

      - name: Apply Rinlo foundation schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schema/rinlo_foundation.sql

      - name: Verify security invariants
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            table_count integer;
            rls_count integer;
            anon_grants integer;
            dangerous_authenticated_grants integer;
          begin
            select count(*) into table_count
            from pg_class c
            join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public' and c.relkind = 'r';
            if table_count <> 11 then
              raise exception 'expected 11 public tables, got %', table_count;
            end if;

            select count(*) into rls_count
            from pg_class c
            join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public' and c.relkind = 'r' and c.relrowsecurity;
            if rls_count <> 11 then
              raise exception 'expected RLS on 11 public tables, got %', rls_count;
            end if;

            if to_regclass('public.app_users') is not null or to_regclass('public.auth_sessions') is not null then
              raise exception 'legacy app_users/auth_sessions must not exist in Supabase foundation';
            end if;

            select count(*) into anon_grants
            from information_schema.role_table_grants
            where table_schema = 'public' and grantee = 'anon';
            if anon_grants <> 0 then
              raise exception 'anon unexpectedly has % public table grants', anon_grants;
            end if;

            select count(*) into dangerous_authenticated_grants
            from information_schema.role_table_grants
            where table_schema = 'public'
              and grantee = 'authenticated'
              and privilege_type in ('TRUNCATE','TRIGGER','REFERENCES');
            if dangerous_authenticated_grants <> 0 then
              raise exception 'authenticated has % dangerous grants', dangerous_authenticated_grants;
            end if;
          end $$;
          SQL

      - name: Verify catalogue is read-only to authenticated clients
        run: |
          psql -At -v ON_ERROR_STOP=1 <<'SQL' | grep -qx 'food_aliases:SELECT|foods:SELECT'
          select string_agg(table_name || ':' || privileges, '|' order by table_name)
          from (
            select table_name, string_agg(privilege_type, ',' order by privilege_type) as privileges
            from information_schema.role_table_grants
            where table_schema='public'
              and grantee='authenticated'
              and table_name in ('foods','food_aliases')
            group by table_name
          ) grants;
          SQL

  live-auth-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://xhlbiaueiqcmgifmihur.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_WFXPfO4XN6rFJ7IA20Px9w_aoLhdJzI
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real anonymous auth and RLS isolation
        run: |
          node <<'NODE'
          const base = process.env.SUPABASE_URL.replace(/\/+$/, '');
          const key = process.env.SUPABASE_PUBLISHABLE_KEY;
          const marker = `rinlo-live-e2e-${process.env.GITHUB_RUN_ID}`;

          function assert(value, message) {
            if (!value) throw new Error(message);
          }

          async function signup(label) {
            const response = await fetch(`${base}/auth/v1/signup`, {
              method: 'POST',
              headers: {
                apikey: key,
                Authorization: `Bearer ${key}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                data: { rinlo_test_marker: marker, rinlo_test_actor: label },
                gotrue_meta_security: { captcha_token: null },
              }),
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(`anonymous signup failed (${response.status}): ${body.message || body.msg || body.error_description || 'unknown'}`);
            assert(body.access_token && body.refresh_token && body.user?.id, 'anonymous signup returned no session');
            assert(body.user.is_anonymous === true, 'created user is not marked anonymous');
            return body;
          }

          async function rest(token, path, { method = 'GET', body, prefer } = {}) {
            const response = await fetch(`${base}/rest/v1/${path}`, {
              method,
              headers: {
                apikey: key,
                Authorization: `Bearer ${token}`,
                Accept: 'application/json',
                ...(body ? { 'Content-Type': 'application/json' } : {}),
                ...(prefer ? { Prefer: prefer } : {}),
              },
              body: body ? JSON.stringify(body) : undefined,
            });
            const text = await response.text();
            let data = null;
            try { data = text ? JSON.parse(text) : null; } catch { data = text; }
            return { response, data };
          }

          const a = await signup('a');
          const b = await signup('b');
          const aId = a.user.id;
          const bId = b.user.id;

          let result = await rest(a.access_token, 'profiles', {
            method: 'POST',
            prefer: 'return=representation',
            body: { user_id: aId, primary_goal: 'weight_loss', step_target: 8000 },
          });
          assert(result.response.ok, `actor A own profile insert failed: ${result.response.status}`);

          result = await rest(b.access_token, 'profiles', {
            method: 'POST',
            prefer: 'return=representation',
            body: { user_id: bId, primary_goal: 'movement', step_target: 7000 },
          });
          assert(result.response.ok, `actor B own profile insert failed: ${result.response.status}`);

          result = await rest(a.access_token, 'profiles?select=user_id,primary_goal,step_target&order=user_id');
          assert(result.response.ok, `actor A profile read failed: ${result.response.status}`);
          assert(Array.isArray(result.data) && result.data.length === 1 && result.data[0].user_id === aId,
            `actor A could see rows outside ownership: ${JSON.stringify(result.data)}`);

          result = await rest(a.access_token, `profiles?user_id=eq.${encodeURIComponent(bId)}`, {
            method: 'PATCH',
            prefer: 'return=representation',
            body: { step_target: 9999 },
          });
          assert(result.response.ok, `cross-user update request returned unexpected HTTP ${result.response.status}`);
          assert(Array.isArray(result.data) && result.data.length === 0,
            `cross-user update changed a row: ${JSON.stringify(result.data)}`);

          result = await rest(key, 'profiles?select=user_id');
          assert(!result.response.ok, 'publishable-key-only anon request unexpectedly accessed profiles');

          for (const [session, id] of [[a, aId], [b, bId]]) {
            result = await rest(session.access_token, `profiles?user_id=eq.${encodeURIComponent(id)}`, {
              method: 'DELETE',
              prefer: 'return=minimal',
            });
            assert(result.response.ok, `profile cleanup failed for ${id}`);
          }

          console.log('Rinlo live Supabase anonymous auth + RLS isolation passed');
          console.log(`cleanup-marker=${marker}`);
          NODE
