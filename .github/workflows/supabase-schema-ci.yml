name: rinlo supabase schema ci

on:
  push:
    paths:
      - 'supabase/schema/**'
      - '.github/workflows/supabase-schema-ci.yml'
  pull_request:
    paths:
      - 'supabase/schema/**'
      - '.github/workflows/supabase-schema-ci.yml'

jobs:
  foundation-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rinlo_schema_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rinlo_schema_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      PGPASSWORD: postgres
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: rinlo_schema_ci

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Supabase auth/role stubs
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create schema auth;
          create schema extensions;
          create table auth.users (id uuid primary key);
          create function auth.uid() returns uuid
          language sql stable
          as $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          SQL

      - name: Apply Rinlo foundation schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schema/rinlo_foundation.sql

      - name: Apply Rinlo sync transport primitives
        run: psql -v ON_ERROR_STOP=1 -f supabase/schema/rinlo_sync_transport.sql

      - name: Apply Rinlo action persistence
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/schema/rinlo_action_sync.sql
          psql -v ON_ERROR_STOP=1 -f supabase/schema/rinlo_action_backfill_order.sql

      - name: Apply Rinlo evening review persistence
        run: psql -v ON_ERROR_STOP=1 -f supabase/schema/rinlo_evening_review.sql

      - name: Verify security invariants
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            table_count integer;
            rls_count integer;
            anon_grants integer;
            dangerous_authenticated_grants integer;
          begin
            select count(*) into table_count
            from pg_class c join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public' and c.relkind = 'r';
            if table_count <> 12 then raise exception 'expected 12 public tables, got %', table_count; end if;

            select count(*) into rls_count
            from pg_class c join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public' and c.relkind = 'r' and c.relrowsecurity;
            if rls_count <> 12 then raise exception 'expected RLS on 12 public tables, got %', rls_count; end if;

            if to_regclass('public.app_users') is not null or to_regclass('public.auth_sessions') is not null then
              raise exception 'legacy auth tables must not exist';
            end if;

            select count(*) into anon_grants
            from information_schema.role_table_grants
            where table_schema = 'public' and grantee = 'anon';
            if anon_grants <> 0 then raise exception 'anon unexpectedly has % public grants', anon_grants; end if;

            select count(*) into dangerous_authenticated_grants
            from information_schema.role_table_grants
            where table_schema = 'public' and grantee = 'authenticated'
              and privilege_type in ('TRUNCATE','TRIGGER','REFERENCES');
            if dangerous_authenticated_grants <> 0 then raise exception 'dangerous authenticated grants: %', dangerous_authenticated_grants; end if;
          end $$;
          SQL

      - name: Verify catalogue is read-only
        run: |
          psql -At -v ON_ERROR_STOP=1 <<'SQL' | grep -qx 'food_aliases:SELECT|foods:SELECT'
          select string_agg(table_name || ':' || privileges, '|' order by table_name)
          from (
            select table_name, string_agg(privilege_type, ',' order by privilege_type) as privileges
            from information_schema.role_table_grants
            where table_schema='public' and grantee='authenticated'
              and table_name in ('foods','food_aliases')
            group by table_name
          ) grants;
          SQL

      - name: Verify RPC exposure is authenticated-only
        run: |
          psql -At -v ON_ERROR_STOP=1 <<'SQL' | grep -qx 'true|true|true|true|false|false|false|false'
          select
            has_function_privilege('authenticated', 'public.rinlo_apply_metric_operation(text,date,integer,integer)', 'EXECUTE') || '|' ||
            has_function_privilege('authenticated', 'public.rinlo_set_daily_habit(date,text,boolean)', 'EXECUTE') || '|' ||
            has_function_privilege('authenticated', 'public.rinlo_import_action(text,date,text,text,text,integer,jsonb,timestamptz)', 'EXECUTE') || '|' ||
            has_function_privilege('authenticated', 'public.rinlo_add_action_event(text,uuid,text,text,jsonb)', 'EXECUTE') || '|' ||
            has_function_privilege('anon', 'public.rinlo_apply_metric_operation(text,date,integer,integer)', 'EXECUTE') || '|' ||
            has_function_privilege('anon', 'public.rinlo_set_daily_habit(date,text,boolean)', 'EXECUTE') || '|' ||
            has_function_privilege('anon', 'public.rinlo_import_action(text,date,text,text,text,integer,jsonb,timestamptz)', 'EXECUTE') || '|' ||
            has_function_privilege('anon', 'public.rinlo_add_action_event(text,uuid,text,text,jsonb)', 'EXECUTE');
          SQL

      - name: Verify metric idempotency and habit atomicity
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          insert into auth.users(id) values('11111111-1111-4111-8111-111111111111');
          set local "request.jwt.claim.sub" = '11111111-1111-4111-8111-111111111111';
          do $$
          declare
            first_result jsonb;
            replay_result jsonb;
            metrics public.daily_metrics%rowtype;
            conflict_seen boolean := false;
          begin
            first_result := public.rinlo_apply_metric_operation('water:ci', '2026-09-11', 250, 0);
            if (first_result->>'replayed')::boolean then raise exception 'first metric replayed'; end if;
            replay_result := public.rinlo_apply_metric_operation('water:ci', '2026-09-11', 250, 0);
            if not (replay_result->>'replayed')::boolean then raise exception 'metric replay not detected'; end if;
            begin
              perform public.rinlo_apply_metric_operation('water:ci', '2026-09-11', 500, 0);
            exception when unique_violation then conflict_seen := true;
            end;
            if not conflict_seen then raise exception 'metric conflict not rejected'; end if;
            perform public.rinlo_set_daily_habit('2026-09-11', 'water', true);
            select * into metrics from public.daily_metrics where user_id=auth.uid() and day='2026-09-11';
            if metrics.water_ml <> 250 or coalesce((metrics.habit_flags->>'water')::boolean,false) is not true then
              raise exception 'habit update corrupted metrics';
            end if;
          end $$;
          rollback;
          SQL

      - name: Verify durable action persistence
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          insert into auth.users(id) values('22222222-2222-4222-8222-222222222222');
          set local "request.jwt.claim.sub" = '22222222-2222-4222-8222-222222222222';
          do $$
          declare
            newer jsonb;
            older jsonb;
            first_event jsonb;
            replay_event jsonb;
            old_id uuid;
            conflict_seen boolean := false;
            total_actions integer;
            active_actions integer;
            completed_history integer;
          begin
            newer := public.rinlo_import_action('new-active','2026-09-11','movement','Новая прогулка','Новый шаг',10,'{}'::jsonb,'2026-09-11T12:00:00Z');
            older := public.rinlo_import_action('old-completed','2026-09-11','nutrition','Старый шаг','История',5,'{}'::jsonb,'2026-09-11T08:00:00Z');
            if not coalesce((older->>'historical')::boolean,false) then raise exception 'older action was not imported as history'; end if;
            select id into old_id from public.rinlo_actions where user_id=auth.uid() and client_action_id='old-completed';
            first_event := public.rinlo_add_action_event('old-complete-op', old_id, 'completed', null, '{}'::jsonb);
            replay_event := public.rinlo_add_action_event('old-complete-op', old_id, 'completed', null, '{}'::jsonb);
            if not (replay_event->>'replayed')::boolean then raise exception 'action event replay not detected'; end if;
            begin
              perform public.rinlo_add_action_event('old-complete-op', old_id, 'dismissed', 'other', '{}'::jsonb);
            exception when unique_violation then conflict_seen := true;
            end;
            if not conflict_seen then raise exception 'action event conflict not rejected'; end if;
            select count(*), count(*) filter(where status in ('suggested','accepted')), count(*) filter(where client_action_id='old-completed' and status='completed')
              into total_actions, active_actions, completed_history
            from public.rinlo_actions where user_id=auth.uid();
            if total_actions <> 2 or active_actions <> 1 or completed_history <> 1 then
              raise exception 'bad action history totals: %, %, %', total_actions, active_actions, completed_history;
            end if;
          end $$;
          rollback;
          SQL

      - name: Verify evening review ownership and upsert shape
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          insert into auth.users(id) values
            ('33333333-3333-4333-8333-333333333333'),
            ('44444444-4444-4444-8444-444444444444');

          set local "request.jwt.claim.sub" = '33333333-3333-4333-8333-333333333333';
          select public.rinlo_import_action('review-a','2026-09-11','movement','Прогулка','Проверка',10,'{}'::jsonb,'2026-09-11T12:00:00Z');
          set local "request.jwt.claim.sub" = '44444444-4444-4444-8444-444444444444';
          select public.rinlo_import_action('review-b','2026-09-11','movement','Чужая прогулка','Проверка',10,'{}'::jsonb,'2026-09-11T13:00:00Z');

          set local role authenticated;
          set local "request.jwt.claim.sub" = '33333333-3333-4333-8333-333333333333';

          insert into public.daily_evening_reviews(user_id, day, plan_fit, action_useful, main_action_id)
          select auth.uid(), '2026-09-11', 'right', 'yes', id
          from public.rinlo_actions where user_id=auth.uid() and client_action_id='review-a';

          insert into public.daily_evening_reviews(user_id, day, plan_fit, action_useful)
          values(auth.uid(), '2026-09-11', 'easy', 'yes')
          on conflict(user_id, day) do update set plan_fit=excluded.plan_fit, updated_at=now();

          do $$
          declare
            row_count integer;
            fit text;
            cross_user_blocked boolean := false;
            foreign_action_blocked boolean := false;
            foreign_action uuid;
          begin
            select count(*), max(plan_fit) into row_count, fit
            from public.daily_evening_reviews where user_id=auth.uid() and day='2026-09-11';
            if row_count <> 1 or fit <> 'easy' then raise exception 'evening review upsert failed'; end if;

            begin
              insert into public.daily_evening_reviews(user_id, day, plan_fit, action_useful)
              values('44444444-4444-4444-8444-444444444444','2026-09-12','right','yes');
            exception when insufficient_privilege then cross_user_blocked := true;
            end;
            if not cross_user_blocked then raise exception 'cross-user evening review write was not blocked'; end if;

            reset role;
            select id into foreign_action from public.rinlo_actions
              where user_id='44444444-4444-4444-8444-444444444444' and client_action_id='review-b';
            set local role authenticated;
            begin
              update public.daily_evening_reviews set main_action_id=foreign_action
              where user_id=auth.uid() and day='2026-09-11';
            exception when foreign_key_violation then foreign_action_blocked := true;
            end;
            if not foreign_action_blocked then raise exception 'cross-user main action link was not blocked'; end if;
          end $$;
          rollback;
          SQL