name: rinlo product reset ci

on:
  push:
    paths:
      - 'pwa.html'
      - 'service-worker.js'
      - 'rinlo-adaptive-learning-v1.js'
      - 'rinlo-product-reset-v1.js'
      - 'tests/rinlo-product-reset.mjs'
      - '.github/workflows/product-reset-ci.yml'
  pull_request:
    paths:
      - 'pwa.html'
      - 'service-worker.js'
      - 'rinlo-adaptive-learning-v1.js'
      - 'rinlo-product-reset-v1.js'
      - 'tests/rinlo-product-reset.mjs'
      - '.github/workflows/product-reset-ci.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Product Reset syntax
        run: |
          node --check rinlo-product-reset-v1.js
          node --check tests/rinlo-product-reset.mjs
      - name: Check Product Reset asset wiring
        run: |
          grep -q 'rinlo-product-reset-v1.js?rev=1' pwa.html
          grep -q './rinlo-product-reset-v1.js?rev=1' service-worker.js
          adaptive_line=$(grep -n 'rinlo-adaptive-learning-v1.js?rev=51' pwa.html | cut -d: -f1)
          reset_line=$(grep -n 'rinlo-product-reset-v1.js?rev=1' pwa.html | cut -d: -f1)
          action_sync_line=$(grep -n 'rinlo-action-sync-v1.js?rev=42' pwa.html | cut -d: -f1)
          test "$adaptive_line" -lt "$reset_line"
          test "$reset_line" -lt "$action_sync_line"
